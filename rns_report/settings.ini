; Settings for the RNS real estate report.
; After changing run_time_uk or days, run Install.bat again. Other changes
; apply from the next run.

[report]
; Folder for the daily files. Leave empty for "Documents\RNS Reports".
output_folder =

; UK time at which the report is made. 07:01 UK is 08:01 in Amsterdam.
run_time_uk = 07:01

; Keep checking for announcements that are published a little late until
; this UK time. The file is updated if any arrive, and is final from then on.
final_time_uk = 07:03

; yes = leave out routine takeover-code disclosures (Form 8.3 / 8.5), NAV
; and similar notices. no = include everything.
exclude_form8_and_nav = no

; Files to write each day: md (for the AI assistant), docx (Word), html, txt
formats = md, docx

; weekdays or daily
days = weekdays
